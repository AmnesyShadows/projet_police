<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BCSO — Formations</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">

</head>


<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/core/supabase.js"></script>


<!-- ============================================================
     COMPONENTS
     ============================================================ -->
<script src="../js/config/menu.config.js"></script>

<script src="../js/components/layout.js"></script>
<script src="../js/components/cards.js"></script>
<script src="../js/components/table.js"></script>
<script src="../js/components/modal.js"></script>
<script src="../js/components/title.js"></script>
<script src="../js/components/badge.js"></script>
<script src="../js/components/alert.js"></script>

<!-- ============================================================
     CONFIG
     ============================================================ -->

<script src="../js/config/formations.config.js"></script>

<!-- ============================================================
     PAGE
     ============================================================ -->

<script src="../js/pages/formations.js"></script>

<script>

    createLayout({
        title: "Formations",
        subtitle: "Liste des formations",
        activePage: "formations"
    });


    const pageContent =
        document.querySelector(".page-content");


    /*
     * TITRE
     */

    pageContent.appendChild(
        createPageTitle(
            "formations",
            "Liste des formations enregistrées"
        )
    );


    /*
     * CONTENEUR LISTE
     */

    const tableContainer =
        document.createElement("div");

    tableContainer.id =
        "formations-table";

    pageContent.appendChild(
        tableContainer
    );

    const ficheContainer =
        document.createElement("div");

    ficheContainer.id =
        "formation-fiche";

    ficheContainer.style.display =
        "none";

    pageContent.appendChild(
        ficheContainer
    );

</script>


</body>

</html>
