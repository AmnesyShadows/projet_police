<script src="../js/pages/comptabilite.js"></script>

<script>

    createLayout({
        title: "Comptabilité",
        subtitle: "Liste des subventions",
        activePage: "comptabilite"
    });


    const pageContent =
        document.querySelector(".page-content");


    /*
     * TITRE
     */

    pageContent.appendChild(
        createPageTitle(
            "Comptabilité",
            "Liste des subventions"
        )
    );


    /*
     * CONTENEUR LISTE
     */

    const tableContainer =
        document.createElement("div");

    tableContainer.id =
        "comptabilites-table";

    pageContent.appendChild(
        tableContainer
    );

    const ficheContainer =
        document.createElement("div");

    ficheContainer.id =
        "comptabilite-fiche";

    ficheContainer.style.display =
        "none";

    pageContent.appendChild(
        ficheContainer
    );
