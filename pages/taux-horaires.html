<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BCSO — Taux horaires</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">

</head>


<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/core/supabase.js"></script>
<script src="../js/config/permissions.config.js"></script>
<script src="../js/core/permissions.js"></script>


<!-- ============================================================
     COMPONENTS
     ============================================================ -->
<script src="../js/config/menu.config.js"></script>

<script src="../js/components/layout.js"></script>
<script src="../js/components/cards.js"></script>
<script src="../js/components/table.js"></script>
<script src="../js/components/modal.js"></script>
<script src="../js/components/title.js"></script>
<script src="../js/components/badge.js"></script>
<script src="../js/components/alert.js"></script>

<!-- ============================================================
     CONFIG
     ============================================================ -->

<script src="../js/config/taux_horaires.config.js"></script>

<!-- ============================================================
     PAGE
     ============================================================ -->

<script src="../js/pages/taux_horaires.js"></script>

<script>

    async function testPermissions() {
        try {
            const agent = await Permissions.getCurrentAgent();

            console.log("Agent connecté :", agent);
            console.log("Grade :", agent?.grade?.nom);
            console.log("Priorité :", agent?.grade?.priority);
            console.log("État-major :", agent?.grade?.etat_major);
        } catch (error) {
            console.error("Erreur permissions :", error);
        }
    }

    testPermissions();

    createLayout({
        title: "Taux horaires",
        subtitle: "Liste des taux horaires",
        activePage: "taux-horaires"
    });


    const pageContent =
        document.querySelector(".page-content");


    /*
     * TITRE
     */

    pageContent.appendChild(
        createPageTitle(
            "Taux horaires",
            "Liste des taux horaires enregistrés"
        )
    );


    /*
     * CONTENEUR LISTE
     */

    const tableContainer =
        document.createElement("div");

    tableContainer.id =
        "taux-horaires-table";

    pageContent.appendChild(
        tableContainer
    );

    const ficheContainer =
        document.createElement("div");

    ficheContainer.id =
        "taux-haraire-fiche";

    ficheContainer.style.display =
        "none";

    pageContent.appendChild(
        ficheContainer
    );

</script>


</body>

</html>
