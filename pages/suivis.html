    <meta

    >

     ============================================================ -->

<!-- ============================================================
     COMPONENTS
     ============================================================ -->
<script src="../js/config/menu.config.js"></script>

<script src="../js/components/layout.js"></script>
<script src="../js/components/cards.js"></script>
<script src="../js/components/table.js"></script>

<!-- ============================================================
     CONFIG
     ============================================================ -->

<script src="../js/config/suivis.config.js"></script>

<!-- ============================================================
     PAGE
     ============================================================ -->

<script src="../js/pages/suivis-form.js"></script>
<script src="../js/pages/suivis.js"></script>

<script>

    createLayout({
        title: "Suivis des agents",
        subtitle: "Liste des suivis des agents",
        activePage: "suivis"
    });


    const pageContent =
        document.querySelector(".page-content");


    /*
     * TITRE
     */

    pageContent.appendChild(
        createPageTitle(
            "Suivis des agents",
            "Liste des suivis des agents enregistrés"
        )
    );


    /*
     * CONTENEUR LISTE
     */

    const tableContainer =
        document.createElement("div");

    tableContainer.id =
        "suivis-table";

    pageContent.appendChild(
        tableContainer
    );

    const ficheContainer =
        document.createElement("div");

    ficheContainer.id =
        "suivi-fiche";

    ficheContainer.style.display =
        "none";

    pageContent.appendChild(
        ficheContainer
    );

</script>


</body>
